name: Release

# Builds forge for Linux, macOS and Windows and publishes the binaries as a
# GitHub release. Run it from the Actions tab with the version to release,
# which tags main's latest commit, or push a tag such as v0.2.0 yourself. A
# tag is also what go install …@latest and forge version --check resolve to.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.2.0. Tags main's latest commit.
        required: true

# The workflow's own token pushes the tag and creates the release.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Resolve and tag the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::$tag isn't a version such as v0.2.0"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists"
              exit 1
            fi
            git tag "$tag"
            git push origin "$tag"
          else
            tag="$REF"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Built in the tagged checkout, go build stamps the binary with the tag,
      # which forge version prints.
      - name: Build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="forge_${TAG#v}_${os}_${arch}"
            bin="forge"
            [ "$os" = windows ] && bin="forge.exe"
            mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "build/$name/$bin" ./cmd/forge
            cp README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ./build/forge_${TAG#v}_linux_amd64/forge version

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --title "forge $TAG" --generate-notes --verify-tag
